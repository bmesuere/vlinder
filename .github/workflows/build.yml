name: Test and Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: dashboard/.nvmrc
          cache: yarn
          cache-dependency-path: dashboard/yarn.lock

      - name: Install, Lint, Test, and Build
        run: |
          cd dashboard
          yarn install --frozen-lockfile
          yarn eslint .
          yarn test
          yarn build
