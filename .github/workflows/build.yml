name: Test and Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: dashboard/.nvmrc
          cache: yarn
          cache-dependency-path: dashboard/yarn.lock

      - name: Install, Lint, Test, and Build
        run: |
          cd dashboard
          yarn install --frozen-lockfile
          yarn eslint .
          yarn test
          yarn build

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./dashboard/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser (with system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          cd dashboard
          npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          cd dashboard
          npx playwright install-deps chromium

      - name: Run Playwright e2e smoke test
        run: |
          cd dashboard
          yarn playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: dashboard/playwright-report/
          retention-days: 7
